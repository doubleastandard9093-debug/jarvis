<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Jarvis</title>
    <script>
      // Any unknown address under the app goes back to the app, which works offline once installed.
      var base = '/jarvis/';
      if (location.pathname.indexOf(base) === 0 && location.pathname !== base) location.replace(base);
    </script>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 48px 24px;
        padding-top: calc(48px + env(safe-area-inset-top, 0px)); color: #0f172a; background: #fff; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { font-size: 15px; line-height: 1.5; color: #475569; }
      a { color: #4f46e5; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Page not found</h1>
    <p>That page isn't part of Jarvis. <a href="/jarvis/">Open Jarvis</a></p>
  </body>
</html>
