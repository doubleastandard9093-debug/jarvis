<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <title>Jarvis is offline</title>
    <style>
      body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 48px 24px;
        padding-top: calc(48px + env(safe-area-inset-top, 0px)); color: #0f172a; background: #fff; }
      h1 { font-size: 22px; margin: 0 0 12px; }
      p { font-size: 15px; line-height: 1.5; color: #475569; }
      button { margin-top: 16px; font-size: 15px; font-weight: 700; color: #fff; background: #4f46e5;
        border: 0; border-radius: 12px; padding: 12px 18px; }
    </style>
  </head>
  <body>
    <h1>Jarvis is offline</h1>
    <p>Jarvis hasn't finished saving itself for offline use on this device yet. Open it once while
      you're online, wait a few seconds, and it will work without a connection after that.</p>
    <button onclick="location.reload()">Try again</button>
  </body>
</html>
